name: Analyze ALFWorld Qwen3-8B GiGPO step 1

on:
  push:
    paths:
      - '.github/workflows/analyze-alfworld-step1.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download public rollout file
        run: |
          set -euxo pipefail
          mkdir -p /tmp/alfworld_step1
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://huggingface.co/datasets/wckwan/PRM-agent-rl-artifacts/resolve/main/rollouts/alfworld_qwen3_8b_gigpo/1.jsonl?download=true' \
            -o /tmp/alfworld_step1/1.jsonl
          echo '94b1d25e91655184ec151ebc835e19a87707fd814cddc2a4c26d2c5b76b91e23  /tmp/alfworld_step1/1.jsonl' | sha256sum -c -
          wc -l /tmp/alfworld_step1/1.jsonl
          ls -lh /tmp/alfworld_step1/1.jsonl

      - name: Parse schema and success/failure pairs
        run: |
          python - <<'PY'
          import json, re, statistics
          from pathlib import Path
          from collections import Counter, defaultdict

          src = Path('/tmp/alfworld_step1/1.jsonl')
          out = Path('analysis/alfworld_qwen3_8b_gigpo/step1')
          out.mkdir(parents=True, exist_ok=True)

          rows = []
          key_types = defaultdict(Counter)

          def scalar_reward(v):
              if isinstance(v, bool):
                  return float(v)
              if isinstance(v, (int, float)):
                  return float(v)
              if isinstance(v, list):
                  vals = [scalar_reward(x) for x in v]
                  vals = [x for x in vals if x is not None]
                  return vals[-1] if vals else None
              if isinstance(v, dict):
                  for k in ('reward','score','success','won','episode_reward','task_reward'):
                      if k in v:
                          x = scalar_reward(v[k])
                          if x is not None:
                              return x
              return None

          def choose(obj, names):
              for k in names:
                  if k in obj:
                      return obj[k], k
              return None, None

          task_patterns = [
              re.compile(r'Your task is to:\s*(.+?)(?:\\n|\n|$)', re.I),
              re.compile(r'Your task is:\s*(.+?)(?:\\n|\n|$)', re.I),
              re.compile(r'(?:^|\\n|\n)Task:\s*(.+?)(?:\\n|\n|$)', re.I),
          ]

          def extract_task(text):
              if not isinstance(text, str):
                  return None
              for p in task_patterns:
                  m = p.search(text)
                  if m:
                      return re.sub(r'\\s+', ' ', m.group(1)).strip()
              return None

          action_patterns = [
              re.compile(r'(?im)^\\s*Action\\s*:\\s*(.+?)\\s*$'),
              re.compile(r'(?i)"action"\\s*:\\s*"([^"]+)"'),
              re.compile(r'(?im)^\\s*action\\s*=\\s*(.+?)\\s*$'),
          ]

          def extract_actions(text, limit=80):
              if not isinstance(text, str):
                  return []
              found=[]
              for p in action_patterns:
                  for m in p.finditer(text):
                      a=re.sub(r'\\s+',' ',m.group(1)).strip().strip('`')
                      if a and a not in found:
                          found.append(a)
                      if len(found)>=limit:
                          return found
              return found

          with src.open('r', encoding='utf-8') as f:
              for idx, line in enumerate(f):
                  if not line.strip():
                      continue
                  obj=json.loads(line)
                  for k,v in obj.items():
                      key_types[k][type(v).__name__]+=1
                  inp, input_key = choose(obj, ('input','prompt','messages','query','instruction'))
                  resp, response_key = choose(obj, ('response','output','completion','answer','trajectory'))
                  rv, reward_key = choose(obj, ('reward','score','episode_reward','rewards','task_reward','success','won'))
                  reward = scalar_reward(rv)
                  inp_text = inp if isinstance(inp,str) else json.dumps(inp,ensure_ascii=False) if inp is not None else ''
                  resp_text = resp if isinstance(resp,str) else json.dumps(resp,ensure_ascii=False) if resp is not None else ''
                  task = extract_task(inp_text)
                  actions = extract_actions(resp_text)
                  rows.append({
                      'index': idx,
                      'obj': obj,
                      'input_key': input_key,
                      'response_key': response_key,
                      'reward_key': reward_key,
                      'reward': reward,
                      'task': task,
                      'input_text': inp_text,
                      'response_text': resp_text,
                      'response_chars': len(resp_text),
                      'input_chars': len(inp_text),
                      'actions': actions,
                  })

          rewards=[r['reward'] for r in rows if r['reward'] is not None]
          tasks=defaultdict(list)
          for r in rows:
              tasks[r['task'] or f'__unknown_row_{r["index"]}'].append(r)

          mixed=[]
          for task, rr in tasks.items():
              vals=[x['reward'] for x in rr if x['reward'] is not None]
              if len(vals)>=2 and min(vals) < max(vals):
                  hi=max((x for x in rr if x['reward'] is not None), key=lambda x:x['reward'])
                  lo=min((x for x in rr if x['reward'] is not None), key=lambda x:x['reward'])
                  mixed.append((max(vals)-min(vals), task, hi, lo, rr))
          mixed.sort(key=lambda x:(-x[0], x[1]))

          summary={
              'source': 'wckwan/PRM-agent-rl-artifacts/rollouts/alfworld_qwen3_8b_gigpo/1.jsonl',
              'sha256': '94b1d25e91655184ec151ebc835e19a87707fd814cddc2a4c26d2c5b76b91e23',
              'rows': len(rows),
              'keys_and_types': {k:dict(v) for k,v in sorted(key_types.items())},
              'input_keys_seen': dict(Counter(r['input_key'] for r in rows)),
              'response_keys_seen': dict(Counter(r['response_key'] for r in rows)),
              'reward_keys_seen': dict(Counter(r['reward_key'] for r in rows)),
              'reward_count': len(rewards),
              'reward_min': min(rewards) if rewards else None,
              'reward_max': max(rewards) if rewards else None,
              'reward_mean': statistics.fmean(rewards) if rewards else None,
              'reward_values': dict(Counter(str(x) for x in rewards)),
              'unique_extracted_tasks': sum(1 for t in tasks if not t.startswith('__unknown_row_')),
              'mixed_outcome_task_groups': len(mixed),
              'response_chars_mean': statistics.fmean(r['response_chars'] for r in rows) if rows else 0,
              'response_chars_median': statistics.median(r['response_chars'] for r in rows) if rows else 0,
          }
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')

          with (out/'rows_index.jsonl').open('w',encoding='utf-8') as f:
              for r in rows:
                  f.write(json.dumps({
                      'index':r['index'],'task':r['task'],'reward':r['reward'],
                      'input_chars':r['input_chars'],'response_chars':r['response_chars'],
                      'action_count_heuristic':len(r['actions']),
                      'actions':r['actions'][:20],
                  },ensure_ascii=False)+'\n')

          selected=[]
          md=[]
          md.append('# ALFWorld Qwen3-8B GiGPO — optimizer step 1\n')
          md.append('Automatically parsed from the public training rollout dump. The pair selection is mechanical: same extracted task, different scalar reward. Action extraction is heuristic and must be checked against the actual transcript format.\n')
          md.append('## Batch summary\n')
          md.append(f"- Rows: **{len(rows)}**")
          md.append(f"- Reward observations: **{len(rewards)}**")
          if rewards:
              md.append(f"- Reward range: **{min(rewards)} → {max(rewards)}**, mean **{statistics.fmean(rewards):.4f}**")
              md.append(f"- Reward distribution: `{dict(Counter(str(x) for x in rewards))}`")
          md.append(f"- Extracted task groups: **{summary['unique_extracted_tasks']}**")
          md.append(f"- Mixed-outcome task groups: **{len(mixed)}**")
          md.append(f"- Response chars median/mean: **{summary['response_chars_median']} / {summary['response_chars_mean']:.1f}**\n")
          md.append('## Schema\n')
          md.append('```json')
          md.append(json.dumps(summary['keys_and_types'],ensure_ascii=False,indent=2))
          md.append('```\n')

          md.append('## Candidate success/failure-style pairs\n')
          if not mixed:
              md.append('No same-task mixed-reward groups were detected by the current task/reward heuristics. Inspect `representative_rows.jsonl` and `rows_index.jsonl` to refine grouping.\n')
          for rank,(gap,task,hi,lo,group) in enumerate(mixed[:12],1):
              md.append(f'### Pair {rank}: {task}\n')
              md.append(f'- group size: {len(group)}')
              md.append(f'- high row: `{hi["index"]}`, reward `{hi["reward"]}`, response chars `{hi["response_chars"]}`')
              md.append(f'- low row: `{lo["index"]}`, reward `{lo["reward"]}`, response chars `{lo["response_chars"]}`')
              md.append(f'- heuristic actions (high): `{hi["actions"][:12]}`')
              md.append(f'- heuristic actions (low): `{lo["actions"][:12]}`\n')
              for label,r in [('HIGH',hi),('LOW',lo)]:
                  text=r['response_text']
                  if len(text)>7000:
                      excerpt=text[:3500]+'\n... [middle omitted] ...\n'+text[-3500:]
                  else:
                      excerpt=text
                  md.append(f'<details><summary>{label} response excerpt — row {r["index"]}</summary>\n\n```text\n{excerpt}\n```\n</details>\n')
                  selected.append({
                      'pair_rank':rank,'side':label,'index':r['index'],'task':r['task'],'reward':r['reward'],
                      'input':r['input_text'],'response':r['response_text'],'actions_heuristic':r['actions']
                  })

          (out/'mixed_pairs.md').write_text('\n'.join(md),encoding='utf-8')
          with (out/'representative_trajectories.jsonl').open('w',encoding='utf-8') as f:
              for x in selected[:24]:
                  f.write(json.dumps(x,ensure_ascii=False)+'\n')

          # Always save the first few raw rows so schema/format can be inspected even if grouping fails.
          with (out/'representative_rows.jsonl').open('w',encoding='utf-8') as f:
              for r in rows[:8]:
                  f.write(json.dumps(r['obj'],ensure_ascii=False)+'\n')

          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Commit analysis outputs
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/alfworld_qwen3_8b_gigpo/step1
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Analyze Qwen3-8B GiGPO ALFWorld step-1 rollouts [skip ci]'
          git push
