name: Analyze ALFWorld Qwen3-8B GiGPO step 1

on:
  push:
    paths:
      - '.github/workflows/analyze-alfworld-step1.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download public rollout file
        run: |
          set -euxo pipefail
          mkdir -p /tmp/alfworld_step1
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://huggingface.co/datasets/wckwan/PRM-agent-rl-artifacts/resolve/main/rollouts/alfworld_qwen3_8b_gigpo/1.jsonl?download=true' \
            -o /tmp/alfworld_step1/1.jsonl
          echo '94b1d25e91655184ec151ebc835e19a87707fd814cddc2a4c26d2c5b76b91e23  /tmp/alfworld_step1/1.jsonl' | sha256sum -c -
          wc -l /tmp/alfworld_step1/1.jsonl
          ls -lh /tmp/alfworld_step1/1.jsonl

      - name: Reconstruct episodes and locate divergence points
        run: |
          python scripts/analyze_alfworld_rollout_dump.py \
            /tmp/alfworld_step1/1.jsonl \
            analysis/alfworld_qwen3_8b_gigpo/step1

      - name: Commit analysis outputs
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/alfworld_qwen3_8b_gigpo/step1
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Reconstruct Qwen3-8B GiGPO ALFWorld step-1 episodes [skip ci]'
          git push
