name: Update literature statistics

on:
  push:
    branches: [main]
    paths:
      - "papers/papers.csv"
      - "scripts/generate_stats.py"
      - ".github/workflows/update-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: literature-stats-main
  cancel-in-progress: false

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas matplotlib

      - name: Generate figures
        run: python scripts/generate_stats.py

      - name: Commit updated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figures
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "chore: update literature statistics"
            git pull --rebase origin main
            git push origin main
          fi
